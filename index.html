<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: var(--font-sans, sans-serif); color: #222; background: #f0ede8; min-height: 600px; }

  /* ── Auth overlay ─────────────────────────────────────────────────────── */
  #auth-overlay {
    position: fixed; inset: 0; z-index: 9999;
    background: rgba(0,0,0,0.55); display: flex; align-items: center; justify-content: center;
  }
  #auth-box {
    background: #fff; border-radius: 14px; padding: 36px 32px; width: 320px;
    box-shadow: 0 8px 40px rgba(0,0,0,0.22); text-align: center;
  }
  #auth-box h2 { font-size: 19px; font-weight: 600; margin-bottom: 6px; color: #1a1a1a; }
  #auth-box p { font-size: 13px; color: #777; margin-bottom: 22px; }
  #auth-box input {
    width: 100%; padding: 10px 14px; font-size: 15px;
    border: 1.5px solid #ddd; border-radius: 8px; margin-bottom: 12px;
    letter-spacing: 3px; text-align: center; color: #222;
  }
  #auth-box input:focus { outline: none; border-color: #8b6c42; }
  #auth-box button {
    width: 100%; padding: 11px; background: #8b6c42; color: #fff;
    border: none; border-radius: 8px; font-size: 14px; cursor: pointer; font-weight: 500;
  }
  #auth-box button:hover { background: #7a5c35; }
  #auth-error { font-size: 12px; color: #c0392b; margin-top: 10px; display: none; }

  /* ── App shell ────────────────────────────────────────────────────────── */
  .app { display: flex; flex-direction: column; height: 100vh; }

  .toolbar {
    display: flex; align-items: center; gap: 10px; padding: 10px 16px;
    background: #fff; border-bottom: 1px solid #ddd; flex-wrap: wrap;
    box-shadow: 0 1px 4px rgba(0,0,0,0.06);
  }
  .toolbar-title { font-size: 15px; font-weight: 600; margin-right: auto; color: #3a2c1e; letter-spacing: 0.3px; }
  .layout-toggle { display: flex; gap: 4px; }
  .layout-btn {
    font-size: 11px; padding: 5px 10px; border: 1px solid #ccc; border-radius: 20px;
    background: transparent; color: #666; cursor: pointer;
  }
  .layout-btn.active { background: #3a2c1e; color: #fff; border-color: #3a2c1e; font-weight: 500; }
  .btn {
    font-size: 12px; padding: 6px 12px; border: 1px solid #ccc; border-radius: 6px;
    background: #fff; color: #444; cursor: pointer; white-space: nowrap;
  }
  .btn:hover { background: #f5f5f5; }
  #sync-status {
    font-size: 11px; padding: 3px 9px; border-radius: 20px;
    background: #eee; color: #777; transition: all 0.3s;
  }
  #sync-status.synced { background: #d4edda; color: #1a5c2e; }
  #sync-status.saving { background: #fff3cd; color: #7a5c00; }
  #sync-status.error  { background: #f8d7da; color: #721c24; }

  .main { display: flex; flex: 1; min-height: 0; overflow: hidden; }

  /* ── Sidebar ──────────────────────────────────────────────────────────── */
  .sidebar {
    width: 210px; min-width: 170px; background: #fff;
    border-right: 1px solid #ddd; display: flex; flex-direction: column; overflow: hidden;
  }
  .sidebar-header {
    padding: 10px 14px; font-size: 12px; font-weight: 500; color: #555;
    border-bottom: 1px solid #eee; display: flex; justify-content: space-between; align-items: center;
  }
  .guest-list { flex: 1; overflow-y: auto; padding: 6px; }
  .guest-chip {
    display: flex; align-items: center; gap: 6px; padding: 5px 8px; border-radius: 7px;
    margin-bottom: 3px; font-size: 13px; cursor: grab;
    border: 1px solid #e8e8e8; background: #fafafa; user-select: none;
  }
  .guest-chip:hover { background: #f0ede8; border-color: #c9a96e; }
  .guest-chip.dragging { opacity: 0.35; }
  .guest-chip .remove-btn { margin-left: auto; font-size: 14px; color: #bbb; cursor: pointer; line-height: 1; }
  .guest-chip .remove-btn:hover { color: #c0392b; }
  .guest-initial {
    width: 24px; height: 24px; border-radius: 50%; flex-shrink: 0;
    background: #c9a96e; color: #fff; font-size: 10px; font-weight: 600;
    display: flex; align-items: center; justify-content: center;
  }
  .import-area { padding: 8px 12px; border-top: 1px solid #eee; }
  .import-area textarea {
    width: 100%; font-size: 11px; border: 1px solid #ddd; border-radius: 6px;
    background: #fafafa; color: #222; padding: 6px 8px; resize: vertical;
    min-height: 52px; max-height: 110px; font-family: inherit;
  }
  .import-area textarea:focus { outline: none; border-color: #8b6c42; }
  .import-area button {
    margin-top: 5px; width: 100%; padding: 7px; font-size: 12px;
    background: #8b6c42; color: #fff; border: none; border-radius: 6px; cursor: pointer; font-weight: 500;
  }
  .import-area button:hover { background: #7a5c35; }

  /* ── Canvas ───────────────────────────────────────────────────────────── */
  .canvas { flex: 1; overflow-y: auto; overflow-x: auto; padding: 20px 24px; background: #f0ede8; }
  .tables-stack { display: flex; flex-direction: column; gap: 24px; min-width: 600px; }

  /* ── Table card ───────────────────────────────────────────────────────── */
  .table-card {
    background: #fff; border: 1px solid #ddd; border-radius: 12px;
    overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.06);
  }
  .table-top-header {
    display: flex; align-items: center; gap: 8px; padding: 10px 16px 8px;
    border-bottom: 1px solid #f0ede8;
  }
  .table-name-input {
    font-size: 14px; font-weight: 600; border: none; background: transparent;
    color: #3a2c1e; flex: 1; padding: 0;
  }
  .table-name-input:focus { outline: none; }
  .table-count { font-size: 12px; color: #999; }
  .table-count.full { color: #c0392b; font-weight: 500; }

  /* ── Seat layout ──────────────────────────────────────────────────────── */
  .seat-layout { padding: 12px 16px; display: flex; flex-direction: column; gap: 0; }

  .seat-row {
    display: flex; flex-wrap: wrap; gap: 5px; padding: 8px 0;
  }
  .seat-row.top-row { border-bottom: 2px solid #c9a96e; padding-bottom: 10px; }
  .seat-row.bot-row { border-top: 2px solid #c9a96e; padding-top: 10px; }

  .table-surface {
    padding: 6px 16px; background: #f5f0e8;
    display: flex; align-items: center; justify-content: center;
    font-size: 12px; color: #8b6c42; font-weight: 500; letter-spacing: 0.5px; text-transform: uppercase;
  }

  /* ── Seat slot ────────────────────────────────────────────────────────── */
  .seat-slot {
    width: 84px; height: 38px; border-radius: 7px;
    border: 1.5px dashed #ccc; background: #fafafa;
    display: flex; align-items: center; justify-content: center;
    font-size: 11px; color: #bbb; cursor: default;
    transition: border-color 0.15s, background 0.15s;
    flex-shrink: 0; position: relative; overflow: hidden;
  }
  .seat-slot.occupied {
    border: 1.5px solid #8b6c42; background: #fdf6ee;
    cursor: grab; color: #3a2c1e;
  }
  .seat-slot.occupied:hover { background: #f5ead8; }
  .seat-slot.occupied.dragging { opacity: 0.35; }
  .seat-slot.drag-over { border-color: #4a9eca; background: #e8f4fb; border-style: solid; }
  .seat-slot.drag-over-full { border-color: #c0392b; background: #fdecea; }

  .seat-inner { display: flex; align-items: center; gap: 4px; padding: 0 5px; width: 100%; }
  .seat-avatar {
    width: 20px; height: 20px; border-radius: 50%; background: #c9a96e;
    color: #fff; font-size: 9px; font-weight: 600; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
  }
  .seat-name { flex: 1; font-size: 11px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .seat-x { font-size: 12px; color: #bbb; cursor: pointer; flex-shrink: 0; line-height: 1; }
  .seat-x:hover { color: #c0392b; }
  .seat-num { font-size: 11px; color: #ccc; }

  /* ── Stats bar ────────────────────────────────────────────────────────── */
  .stats-bar {
    display: flex; gap: 18px; padding: 8px 18px; font-size: 12px; color: #777;
    background: #fff; border-top: 1px solid #ddd;
  }
  .stat { display: flex; gap: 4px; }
  .stat strong { color: #222; font-weight: 600; }
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
</head>
<body>

<!-- Password gate -->
<div id="auth-overlay">
  <div id="auth-box">
    <h2>Domaine de Valbonne</h2>
    <p>Enter the password to edit the seating plan</p>
    <input type="password" id="auth-input" placeholder="Password" autocomplete="current-password" />
    <button onclick="checkPassword()">Enter</button>
    <div id="auth-error">Incorrect password — try again</div>
  </div>
</div>

<div class="app">
  <div class="toolbar">
    <span class="toolbar-title">Domaine de Valbonne</span>
    <div class="layout-toggle">
      <button class="layout-btn active" id="btn-layout-a" onclick="setLayout('A')">4 × 30</button>
      <button class="layout-btn" id="btn-layout-b" onclick="setLayout('B')">18 · 30 · 24 · 24 · 24</button>
    </div>
    <button class="btn" onclick="clearAll()">Clear seats</button>
    <button class="btn" onclick="exportCSV()">Export CSV</button>
    <span id="sync-status">connecting…</span>
  </div>

  <div class="main">
    <div class="sidebar">
      <div class="sidebar-header">
        <span>Unassigned</span>
        <span id="unassigned-count" style="font-weight:600;color:#3a2c1e">0</span>
      </div>
      <div class="guest-list" id="unassigned-list"></div>
      <div class="import-area">
        <textarea id="bulk-input" placeholder="Paste names, one per line…"></textarea>
        <button onclick="bulkAdd()">Add names</button>
      </div>
    </div>

    <div class="canvas">
      <div class="tables-stack" id="tables-stack"></div>
    </div>
  </div>

  <div class="stats-bar">
    <div class="stat">Total: <strong id="stat-total">0</strong></div>
    <div class="stat">Seated: <strong id="stat-seated">0</strong></div>
    <div class="stat">Unassigned: <strong id="stat-unassigned">0</strong></div>
    <div class="stat">Capacity: <strong id="stat-capacity">0</strong></div>
    <div class="stat">Open seats: <strong id="stat-remaining">0</strong></div>
  </div>
</div>

<script>
// ── Auth ──────────────────────────────────────────────────────────────────────
const PASSWORD = 'Provence';
if (sessionStorage.getItem('valbonne-auth') === '1') {
  document.getElementById('auth-overlay').style.display = 'none';
}
document.getElementById('auth-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') checkPassword();
});
function checkPassword() {
  if (document.getElementById('auth-input').value === PASSWORD) {
    sessionStorage.setItem('valbonne-auth', '1');
    document.getElementById('auth-overlay').style.display = 'none';
  } else {
    document.getElementById('auth-error').style.display = 'block';
    document.getElementById('auth-input').value = '';
    document.getElementById('auth-input').focus();
  }
}

// ── Supabase ──────────────────────────────────────────────────────────────────
const SUPABASE_URL = 'https://zcwacigbdcgbsbqvyaob.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_4Bcq6Bp3qgeLMkvCTTww5Q_XZpe8zNM';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const syncEl = document.getElementById('sync-status');
function setSyncStatus(s) {
  syncEl.className = s;
  syncEl.textContent = s === 'synced' ? 'synced' : s === 'saving' ? 'saving…' : s === 'error' ? 'sync error' : 'connecting…';
}

let _ignoreNext = false;
sb.channel('seating')
  .on('postgres_changes', { event: '*', schema: 'public', table: 'seating_state' },
    payload => {
      if (_ignoreNext) { _ignoreNext = false; return; }
      if (payload.new?.state && Object.keys(payload.new.state).length) {
        state = migrateState(payload.new.state);
        render();
        setSyncStatus('synced');
      }
    })
  .subscribe(status => { if (status === 'SUBSCRIBED') setSyncStatus('synced'); });

(async () => {
  const { data, error } = await sb.from('seating_state').select('state').eq('id', 1).maybeSingle();
  if (error) { setSyncStatus('error'); return; }
  if (data?.state && Object.keys(data.state).length) {
    state = migrateState(data.state);
    render();
  }
  setSyncStatus('synced');
})();

// ── Layouts ───────────────────────────────────────────────────────────────────
const LAYOUTS = {
  A: [
    { id: 'T1', name: 'Table 1', cap: 30 },
    { id: 'T2', name: 'Table 2', cap: 30 },
    { id: 'T3', name: 'Table 3', cap: 30 },
    { id: 'T4', name: 'Table 4', cap: 30 },
  ],
  B: [
    { id: 'T1', name: 'Top table', cap: 18 },
    { id: 'T2', name: 'Table 2', cap: 30 },
    { id: 'T3', name: 'Table 3', cap: 24 },
    { id: 'T4', name: 'Table 4', cap: 24 },
    { id: 'T5', name: 'Table 5', cap: 24 },
  ]
};

// State: seating[tableId] is a sparse object { seatIndex: guestName }
let state = migrateState(loadLocal()) || {
  layout: 'A', guests: [], seating: {}, tableNames: {}
};

// Drag state
let dragGuest = null;  // guest name being dragged
let dragSource = null; // { type: 'unassigned' } | { type: 'seated', tableId, seatIndex }

// ── State migration (from old array format) ───────────────────────────────────
function migrateState(s) {
  if (!s) return s;
  if (!s.seating) s.seating = {};
  Object.keys(s.seating).forEach(tid => {
    if (Array.isArray(s.seating[tid])) {
      const arr = s.seating[tid];
      s.seating[tid] = {};
      arr.forEach((name, i) => { if (name) s.seating[tid][i] = name; });
    }
  });
  return s;
}

// ── Persistence ───────────────────────────────────────────────────────────────
function save() {
  try { localStorage.setItem('valbonne-seating', JSON.stringify(state)); } catch(e) {}
  setSyncStatus('saving');
  _ignoreNext = true;
  sb.from('seating_state').upsert({ id: 1, state }).then(({ error }) => {
    setSyncStatus(error ? 'error' : 'synced');
    if (error) _ignoreNext = false;
  });
}
function loadLocal() {
  try {
    const d = localStorage.getItem('valbonne-seating');
    return d ? JSON.parse(d) : null;
  } catch(e) { return null; }
}

// ── Helpers ───────────────────────────────────────────────────────────────────
function initials(name) {
  return name.trim().split(/\s+/).map(w => w[0]).join('').toUpperCase().slice(0, 2);
}
function firstName(name) {
  return name.trim().split(/\s+/)[0];
}
function isSeated(name) {
  return Object.values(state.seating).some(m => Object.values(m).includes(name));
}
function findSeat(name) {
  for (const [tid, m] of Object.entries(state.seating)) {
    for (const [si, n] of Object.entries(m)) {
      if (n === name) return { tableId: tid, seatIndex: Number(si) };
    }
  }
  return null;
}
function removeFromEverywhere(name) {
  state.guests = state.guests.filter(g => g !== name);
  Object.keys(state.seating).forEach(tid => {
    Object.keys(state.seating[tid]).forEach(si => {
      if (state.seating[tid][si] === name) delete state.seating[tid][si];
    });
  });
}

// ── Actions ───────────────────────────────────────────────────────────────────
function setLayout(l) {
  if (state.layout === l) return;
  const newIds = LAYOUTS[l].map(t => t.id);
  Object.keys(state.seating).forEach(id => {
    if (!newIds.includes(id)) {
      Object.values(state.seating[id]).forEach(g => {
        if (!state.guests.includes(g)) state.guests.push(g);
      });
      delete state.seating[id];
    }
  });
  state.layout = l;
  save(); render();
}

function addGuest(name) {
  name = name.trim();
  if (!name || state.guests.includes(name) || isSeated(name)) return;
  state.guests.push(name);
  save();
}

function assignToSeat(guestName, tableId, seatIndex) {
  const tables = LAYOUTS[state.layout];
  const table = tables.find(t => t.id === tableId);
  if (!table) return;
  if (!state.seating[tableId]) state.seating[tableId] = {};
  if (state.seating[tableId][seatIndex]) return; // seat taken
  removeFromEverywhere(guestName);
  state.seating[tableId][seatIndex] = guestName;
  save(); render();
}

function unassignSeat(tableId, seatIndex) {
  const name = state.seating[tableId]?.[seatIndex];
  if (!name) return;
  delete state.seating[tableId][seatIndex];
  state.guests.push(name);
  save(); render();
}

function removeGuest(name) {
  removeFromEverywhere(name);
  save(); render();
}

function clearAll() {
  const all = [...state.guests];
  Object.values(state.seating).forEach(m => Object.values(m).forEach(g => { if (!all.includes(g)) all.push(g); }));
  state.guests = all;
  state.seating = {};
  save(); render();
}

function bulkAdd() {
  const ta = document.getElementById('bulk-input');
  ta.value.split('\n').map(l => l.trim()).filter(Boolean).forEach(addGuest);
  ta.value = '';
  save(); render();
}

function exportCSV() {
  const tables = LAYOUTS[state.layout];
  const rows = [['Guest', 'Table', 'Seat']];
  tables.forEach(t => {
    const tname = state.tableNames[t.id] || t.name;
    const m = state.seating[t.id] || {};
    Object.entries(m).sort((a,b) => a[0]-b[0]).forEach(([si, g]) => rows.push([g, tname, Number(si)+1]));
  });
  state.guests.forEach(g => rows.push([g, 'Unassigned', '']));
  const csv = rows.map(r => r.map(c => `"${c}"`).join(',')).join('\n');
  const a = document.createElement('a');
  a.href = 'data:text/csv,' + encodeURIComponent(csv);
  a.download = 'seating-plan.csv';
  a.click();
}

// ── Render ────────────────────────────────────────────────────────────────────
function render() {
  document.getElementById('btn-layout-a').className = 'layout-btn' + (state.layout === 'A' ? ' active' : '');
  document.getElementById('btn-layout-b').className = 'layout-btn' + (state.layout === 'B' ? ' active' : '');
  renderUnassigned();
  renderTables();
  renderStats();
}

function renderUnassigned() {
  const list = document.getElementById('unassigned-list');
  list.innerHTML = '';
  const guests = state.guests.slice().sort();
  document.getElementById('unassigned-count').textContent = guests.length;
  if (!guests.length) {
    list.innerHTML = '<div style="font-size:12px;color:#bbb;text-align:center;padding:18px 8px;">All guests seated!</div>';
    return;
  }
  guests.forEach(name => {
    const chip = document.createElement('div');
    chip.className = 'guest-chip';
    chip.draggable = true;
    chip.innerHTML = `<div class="guest-initial">${initials(name)}</div><span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${name}</span><span class="remove-btn" title="Remove">×</span>`;
    chip.querySelector('.remove-btn').addEventListener('click', e => { e.stopPropagation(); removeGuest(name); });
    chip.addEventListener('dragstart', e => {
      dragGuest = name; dragSource = { type: 'unassigned' };
      chip.classList.add('dragging'); e.dataTransfer.effectAllowed = 'move';
    });
    chip.addEventListener('dragend', () => { dragGuest = null; dragSource = null; chip.classList.remove('dragging'); });
    list.appendChild(chip);
  });
}

function makeSeatSlot(tableId, seatIndex, cap) {
  const seatMap = state.seating[tableId] || {};
  const guest = seatMap[seatIndex] || null;
  const totalOccupied = Object.keys(seatMap).length;

  const slot = document.createElement('div');
  slot.className = 'seat-slot' + (guest ? ' occupied' : '');

  if (guest) {
    slot.draggable = true;
    const inner = document.createElement('div');
    inner.className = 'seat-inner';
    inner.innerHTML = `<div class="seat-avatar">${initials(guest)}</div><span class="seat-name" title="${guest}">${firstName(guest)}</span><span class="seat-x" title="Unassign">×</span>`;
    inner.querySelector('.seat-x').addEventListener('click', e => { e.stopPropagation(); unassignSeat(tableId, seatIndex); });
    slot.appendChild(inner);
    slot.addEventListener('dragstart', e => {
      dragGuest = guest; dragSource = { type: 'seated', tableId, seatIndex };
      slot.classList.add('dragging'); e.dataTransfer.effectAllowed = 'move';
    });
    slot.addEventListener('dragend', () => { dragGuest = null; dragSource = null; slot.classList.remove('dragging'); });
  } else {
    const num = document.createElement('span');
    num.className = 'seat-num';
    num.textContent = seatIndex + 1;
    slot.appendChild(num);
  }

  // Drop target (only accept drops onto empty seats)
  slot.addEventListener('dragover', e => {
    if (!dragGuest || guest) return;
    e.preventDefault();
    slot.classList.add('drag-over');
  });
  slot.addEventListener('dragleave', () => slot.classList.remove('drag-over'));
  slot.addEventListener('drop', e => {
    e.preventDefault();
    slot.classList.remove('drag-over');
    if (dragGuest && !guest) assignToSeat(dragGuest, tableId, seatIndex);
  });

  return slot;
}

function renderTables() {
  const stack = document.getElementById('tables-stack');
  stack.innerHTML = '';
  const tables = LAYOUTS[state.layout];

  tables.forEach(t => {
    const seatMap = state.seating[t.id] || {};
    const seatedCount = Object.keys(seatMap).length;
    const tname = state.tableNames[t.id] || t.name;
    const full = seatedCount >= t.cap;
    const topCount = Math.ceil(t.cap / 2);

    const card = document.createElement('div');
    card.className = 'table-card';

    // Header
    const hdr = document.createElement('div');
    hdr.className = 'table-top-header';
    const inp = document.createElement('input');
    inp.className = 'table-name-input';
    inp.value = tname;
    inp.title = 'Click to rename';
    inp.addEventListener('change', () => { state.tableNames[t.id] = inp.value.trim() || t.name; save(); });
    const cnt = document.createElement('span');
    cnt.className = 'table-count' + (full ? ' full' : '');
    cnt.textContent = `${seatedCount} / ${t.cap}${full ? ' — full' : ''}`;
    hdr.appendChild(inp);
    hdr.appendChild(cnt);
    card.appendChild(hdr);

    // Seat layout
    const layout = document.createElement('div');
    layout.className = 'seat-layout';

    // Top row
    const topRow = document.createElement('div');
    topRow.className = 'seat-row top-row';
    for (let i = 0; i < topCount; i++) topRow.appendChild(makeSeatSlot(t.id, i, t.cap));
    layout.appendChild(topRow);

    // Table surface label
    const surf = document.createElement('div');
    surf.className = 'table-surface';
    surf.textContent = tname;
    layout.appendChild(surf);

    // Bottom row
    const botRow = document.createElement('div');
    botRow.className = 'seat-row bot-row';
    for (let i = topCount; i < t.cap; i++) botRow.appendChild(makeSeatSlot(t.id, i, t.cap));
    layout.appendChild(botRow);

    card.appendChild(layout);
    stack.appendChild(card);
  });
}

function renderStats() {
  const tables = LAYOUTS[state.layout];
  const totalCap = tables.reduce((s, t) => s + t.cap, 0);
  const seated = Object.values(state.seating).reduce((s, m) => s + Object.keys(m).length, 0);
  const total = state.guests.length + seated;
  document.getElementById('stat-total').textContent = total;
  document.getElementById('stat-seated').textContent = seated;
  document.getElementById('stat-unassigned').textContent = state.guests.length;
  document.getElementById('stat-capacity').textContent = totalCap;
  document.getElementById('stat-remaining').textContent = Math.max(0, totalCap - seated);
}

render();
</script>
</body>
</html>
