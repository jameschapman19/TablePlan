<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: var(--font-sans, sans-serif); color: var(--color-text-primary); background: transparent; min-height: 600px; }

  /* Password overlay */
  #auth-overlay {
    position: fixed; inset: 0; z-index: 9999;
    background: rgba(0,0,0,0.55); display: flex; align-items: center; justify-content: center;
  }
  #auth-box {
    background: #fff; border-radius: 12px; padding: 32px 28px; width: 320px;
    box-shadow: 0 8px 40px rgba(0,0,0,0.18); text-align: center;
  }
  #auth-box h2 { font-size: 18px; font-weight: 600; margin-bottom: 6px; color: #111; }
  #auth-box p { font-size: 13px; color: #666; margin-bottom: 20px; }
  #auth-box input {
    width: 100%; padding: 10px 12px; font-size: 15px; border: 1px solid #ddd;
    border-radius: 8px; margin-bottom: 12px; letter-spacing: 2px; text-align: center;
  }
  #auth-box input:focus { outline: none; border-color: #8b6c42; }
  #auth-box button {
    width: 100%; padding: 10px; background: #8b6c42; color: #fff;
    border: none; border-radius: 8px; font-size: 14px; cursor: pointer; font-weight: 500;
  }
  #auth-box button:hover { background: #7a5c35; }
  #auth-error { font-size: 12px; color: #c0392b; margin-top: 8px; display: none; }

  .app { display: flex; flex-direction: column; gap: 0; height: 100%; min-height: 700px; }

  .toolbar { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-bottom: 0.5px solid var(--color-border-tertiary); flex-wrap: wrap; }
  .toolbar-title { font-size: 15px; font-weight: 500; margin-right: auto; }

  .add-guest-row { display: flex; gap: 8px; flex: 1; min-width: 220px; }
  .add-guest-row input { flex: 1; min-width: 0; font-size: 13px; padding: 6px 10px; border: 0.5px solid var(--color-border-tertiary); border-radius: var(--border-radius-md); background: var(--color-background-primary); color: var(--color-text-primary); }
  .add-guest-row input:focus { outline: none; border-color: var(--color-border-primary); }
  .btn { font-size: 12px; padding: 6px 12px; border: 0.5px solid var(--color-border-secondary); border-radius: var(--border-radius-md); background: transparent; color: var(--color-text-primary); cursor: pointer; white-space: nowrap; }
  .btn:hover { background: var(--color-background-secondary); }
  .btn:active { transform: scale(0.98); }
  .btn-primary { background: var(--color-background-info); border-color: var(--color-border-info); color: var(--color-text-info); }
  .btn-primary:hover { opacity: 0.85; }

  .layout-toggle { display: flex; gap: 4px; }
  .layout-btn { font-size: 11px; padding: 5px 10px; border: 0.5px solid var(--color-border-tertiary); border-radius: var(--border-radius-md); background: transparent; color: var(--color-text-secondary); cursor: pointer; }
  .layout-btn.active { background: var(--color-background-secondary); color: var(--color-text-primary); border-color: var(--color-border-secondary); font-weight: 500; }

  /* Sync status indicator */
  #sync-status {
    font-size: 11px; padding: 3px 8px; border-radius: 12px;
    background: #eee; color: #666; transition: all 0.3s;
  }
  #sync-status.synced { background: #d4edda; color: #155724; }
  #sync-status.saving { background: #fff3cd; color: #856404; }
  #sync-status.error { background: #f8d7da; color: #721c24; }

  .main { display: flex; flex: 1; min-height: 0; overflow: hidden; }

  .sidebar { width: 220px; min-width: 180px; border-right: 0.5px solid var(--color-border-tertiary); display: flex; flex-direction: column; overflow: hidden; }
  .sidebar-header { padding: 10px 14px; font-size: 12px; color: var(--color-text-secondary); border-bottom: 0.5px solid var(--color-border-tertiary); display: flex; justify-content: space-between; align-items: center; }
  .guest-list { flex: 1; overflow-y: auto; padding: 6px; }
  .guest-chip { display: flex; align-items: center; gap: 6px; padding: 5px 8px; border-radius: var(--border-radius-md); margin-bottom: 3px; font-size: 13px; cursor: grab; border: 0.5px solid var(--color-border-tertiary); background: var(--color-background-primary); user-select: none; transition: background 0.1s; }
  .guest-chip:hover { background: var(--color-background-secondary); }
  .guest-chip.dragging { opacity: 0.4; }
  .guest-chip .remove-btn { margin-left: auto; font-size: 11px; color: var(--color-text-tertiary); cursor: pointer; padding: 0 2px; }
  .guest-chip .remove-btn:hover { color: var(--color-text-danger); }
  .guest-initial { width: 22px; height: 22px; border-radius: 50%; background: var(--color-background-info); color: var(--color-text-info); font-size: 10px; font-weight: 500; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }

  .canvas { flex: 1; overflow: auto; padding: 20px; background: var(--color-background-tertiary, var(--color-background-secondary)); position: relative; }

  .tables-grid { display: flex; flex-wrap: wrap; gap: 20px; align-content: flex-start; }

  .table-card { background: var(--color-background-primary); border: 0.5px solid var(--color-border-tertiary); border-radius: var(--border-radius-lg); overflow: hidden; width: 220px; flex-shrink: 0; }
  .table-card.drag-over { border-color: var(--color-border-info); background: var(--color-background-info); }
  .table-header { padding: 10px 14px 8px; border-bottom: 0.5px solid var(--color-border-tertiary); }
  .table-name-row { display: flex; align-items: center; gap: 6px; }
  .table-name-input { font-size: 13px; font-weight: 500; border: none; background: transparent; color: var(--color-text-primary); width: 100%; padding: 0; }
  .table-name-input:focus { outline: none; }
  .table-meta { font-size: 11px; color: var(--color-text-tertiary); margin-top: 2px; }
  .table-meta.full { color: var(--color-text-danger); }

  .seat-list { padding: 6px; min-height: 40px; }
  .seat-chip { display: flex; align-items: center; gap: 6px; padding: 4px 8px; border-radius: var(--border-radius-md); font-size: 12px; margin-bottom: 3px; background: var(--color-background-secondary); cursor: pointer; }
  .seat-chip:hover { background: var(--color-background-tertiary, var(--color-background-secondary)); }
  .seat-chip .x { margin-left: auto; color: var(--color-text-tertiary); font-size: 11px; }
  .seat-chip .x:hover { color: var(--color-text-danger); }
  .seat-initial { width: 18px; height: 18px; border-radius: 50%; background: var(--color-background-success); color: var(--color-text-success); font-size: 9px; font-weight: 500; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }

  .empty-drop { font-size: 12px; color: var(--color-text-tertiary); text-align: center; padding: 12px 8px; }

  .stats-bar { display: flex; gap: 16px; padding: 8px 16px; border-top: 0.5px solid var(--color-border-tertiary); font-size: 12px; color: var(--color-text-secondary); background: var(--color-background-primary); }
  .stat { display: flex; gap: 4px; }
  .stat strong { color: var(--color-text-primary); font-weight: 500; }

  .import-area { padding: 8px 14px; border-top: 0.5px solid var(--color-border-tertiary); }
  .import-area textarea { width: 100%; font-size: 11px; border: 0.5px solid var(--color-border-tertiary); border-radius: var(--border-radius-md); background: var(--color-background-secondary); color: var(--color-text-primary); padding: 6px 8px; resize: vertical; min-height: 50px; max-height: 100px; font-family: var(--font-sans); }
  .import-area textarea:focus { outline: none; border-color: var(--color-border-primary); }
  .import-actions { display: flex; gap: 6px; margin-top: 4px; }
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
</head>
<body>

<!-- Password gate -->
<div id="auth-overlay">
  <div id="auth-box">
    <h2>Domaine de Valbonne</h2>
    <p>Enter the password to edit the seating plan</p>
    <input type="password" id="auth-input" placeholder="Password" autocomplete="current-password" />
    <button onclick="checkPassword()">Enter</button>
    <div id="auth-error">Incorrect password — try again</div>
  </div>
</div>

<div class="app" id="app">
  <div class="toolbar">
    <span class="toolbar-title">Domaine de Valbonne</span>
    <div class="layout-toggle">
      <button class="layout-btn active" id="btn-layout-a" onclick="setLayout('A')">4 × 30</button>
      <button class="layout-btn" id="btn-layout-b" onclick="setLayout('B')">18 · 30 · 24 · 24 · 24</button>
    </div>
    <button class="btn" onclick="clearAll()" title="Clear all seating assignments">Clear seats</button>
    <button class="btn" onclick="exportCSV()">Export CSV</button>
    <span id="sync-status">connecting…</span>
  </div>

  <div class="main">
    <div class="sidebar">
      <div class="sidebar-header">
        <span>Unassigned guests</span>
        <span id="unassigned-count" style="font-weight:500;color:var(--color-text-primary)">0</span>
      </div>
      <div class="guest-list" id="unassigned-list">
      </div>
      <div class="import-area">
        <textarea id="bulk-input" placeholder="Paste names, one per line…"></textarea>
        <div class="import-actions">
          <button class="btn btn-primary" style="flex:1" onclick="bulkAdd()">Add names</button>
        </div>
      </div>
    </div>

    <div class="canvas">
      <div class="tables-grid" id="tables-grid"></div>
    </div>
  </div>

  <div class="stats-bar">
    <div class="stat">Total guests: <strong id="stat-total">0</strong></div>
    <div class="stat">Seated: <strong id="stat-seated">0</strong></div>
    <div class="stat">Unassigned: <strong id="stat-unassigned">0</strong></div>
    <div class="stat">Capacity: <strong id="stat-capacity">0</strong></div>
    <div class="stat" id="stat-remaining-wrap">Remaining seats: <strong id="stat-remaining">0</strong></div>
  </div>
</div>

<script>
// ── Auth ──────────────────────────────────────────────────────────────────────
const PASSWORD = 'Provence';
(function() {
  if (sessionStorage.getItem('valbonne-auth') === '1') {
    document.getElementById('auth-overlay').style.display = 'none';
  }
  document.getElementById('auth-input').addEventListener('keydown', e => {
    if (e.key === 'Enter') checkPassword();
  });
})();

function checkPassword() {
  const val = document.getElementById('auth-input').value;
  if (val === PASSWORD) {
    sessionStorage.setItem('valbonne-auth', '1');
    document.getElementById('auth-overlay').style.display = 'none';
  } else {
    document.getElementById('auth-error').style.display = 'block';
    document.getElementById('auth-input').value = '';
    document.getElementById('auth-input').focus();
  }
}

// ── Supabase ──────────────────────────────────────────────────────────────────
const SUPABASE_URL = 'https://zcwacigbdcgbsbqvyaob.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_4Bcq6Bp3qgeLMkvCTTww5Q_XZpe8zNM';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const syncEl = document.getElementById('sync-status');
function setSyncStatus(s) {
  syncEl.className = s;
  syncEl.textContent = s === 'synced' ? 'synced' : s === 'saving' ? 'saving…' : s === 'error' ? 'sync error' : 'connecting…';
}

let _ignoreNext = false;

// Subscribe to remote changes
sb.channel('seating')
  .on('postgres_changes', { event: '*', schema: 'public', table: 'seating_state' },
    payload => {
      if (_ignoreNext) { _ignoreNext = false; return; }
      if (payload.new?.state && Object.keys(payload.new.state).length) {
        state = payload.new.state;
        render();
        setSyncStatus('synced');
      }
    })
  .subscribe(status => {
    if (status === 'SUBSCRIBED') setSyncStatus('synced');
  });

// Load initial state from Supabase on page load (overrides localStorage if row exists)
(async () => {
  const { data, error } = await sb.from('seating_state').select('state').eq('id', 1).maybeSingle();
  if (error) { setSyncStatus('error'); return; }
  if (data?.state && Object.keys(data.state).length) {
    state = data.state;
    render();
  }
  setSyncStatus('synced');
})();

// ── Layouts ───────────────────────────────────────────────────────────────────
const LAYOUTS = {
  A: [
    { id: 'T1', name: 'Table 1', cap: 30 },
    { id: 'T2', name: 'Table 2', cap: 30 },
    { id: 'T3', name: 'Table 3', cap: 30 },
    { id: 'T4', name: 'Table 4', cap: 30 },
  ],
  B: [
    { id: 'T1', name: 'Top table', cap: 18 },
    { id: 'T2', name: 'Table 2', cap: 30 },
    { id: 'T3', name: 'Table 3', cap: 24 },
    { id: 'T4', name: 'Table 4', cap: 24 },
    { id: 'T5', name: 'Table 5', cap: 24 },
  ]
};

let state = load() || {
  layout: 'A',
  guests: [],
  seating: {},
  tableNames: {}
};

let dragGuest = null;

function save() {
  try { localStorage.setItem('valbonne-seating', JSON.stringify(state)); } catch(e) {}
  setSyncStatus('saving');
  _ignoreNext = true;
  sb.from('seating_state').upsert({ id: 1, state }).then(({ error }) => {
    setSyncStatus(error ? 'error' : 'synced');
    if (error) _ignoreNext = false;
  });
}

function load() {
  try {
    const d = localStorage.getItem('valbonne-seating');
    return d ? JSON.parse(d) : null;
  } catch(e) { return null; }
}

function initials(name) {
  return name.trim().split(/\s+/).map(w => w[0]).join('').toUpperCase().slice(0, 2);
}

function setLayout(l) {
  if (state.layout === l) return;
  const tables = LAYOUTS[l];
  const newIds = tables.map(t => t.id);
  const oldIds = Object.keys(state.seating);
  oldIds.forEach(id => {
    if (!newIds.includes(id)) {
      (state.seating[id] || []).forEach(g => {
        if (!state.guests.includes(g)) state.guests.push(g);
      });
      delete state.seating[id];
    }
  });
  state.layout = l;
  save();
  render();
}

function addGuest(name) {
  name = name.trim();
  if (!name) return;
  if (state.guests.includes(name) || isSeated(name)) return;
  state.guests.push(name);
  save();
}

function isSeated(name) {
  return Object.values(state.seating).some(arr => arr.includes(name));
}

function getTableForGuest(name) {
  return Object.entries(state.seating).find(([,arr]) => arr.includes(name))?.[0];
}

function unassignGuest(name) {
  Object.keys(state.seating).forEach(id => {
    state.seating[id] = (state.seating[id] || []).filter(g => g !== name);
  });
  if (!state.guests.includes(name)) state.guests.push(name);
  save();
  render();
}

function removeGuest(name) {
  state.guests = state.guests.filter(g => g !== name);
  Object.keys(state.seating).forEach(id => {
    state.seating[id] = (state.seating[id] || []).filter(g => g !== name);
  });
  save();
  render();
}

function assignToTable(guestName, tableId) {
  const tables = LAYOUTS[state.layout];
  const table = tables.find(t => t.id === tableId);
  if (!table) return;
  const seated = (state.seating[tableId] || []);
  if (seated.includes(guestName)) return;
  if (seated.length >= table.cap) return;
  state.guests = state.guests.filter(g => g !== guestName);
  Object.keys(state.seating).forEach(id => {
    state.seating[id] = (state.seating[id] || []).filter(g => g !== guestName);
  });
  if (!state.seating[tableId]) state.seating[tableId] = [];
  state.seating[tableId].push(guestName);
  save();
  render();
}

function clearAll() {
  const allGuests = [...state.guests];
  Object.values(state.seating).forEach(arr => arr.forEach(g => { if (!allGuests.includes(g)) allGuests.push(g); }));
  state.guests = allGuests;
  state.seating = {};
  save();
  render();
}

function bulkAdd() {
  const ta = document.getElementById('bulk-input');
  const lines = ta.value.split('\n').map(l => l.trim()).filter(Boolean);
  lines.forEach(addGuest);
  ta.value = '';
  save();
  render();
}

function exportCSV() {
  const tables = LAYOUTS[state.layout];
  const rows = [['Guest', 'Table']];
  tables.forEach(t => {
    const name = state.tableNames[t.id] || t.name;
    (state.seating[t.id] || []).forEach(g => rows.push([g, name]));
  });
  state.guests.forEach(g => rows.push([g, 'Unassigned']));
  const csv = rows.map(r => r.map(c => `"${c}"`).join(',')).join('\n');
  const a = document.createElement('a');
  a.href = 'data:text/csv,' + encodeURIComponent(csv);
  a.download = 'seating-plan.csv';
  a.click();
}

function render() {
  renderLayoutBtns();
  renderUnassigned();
  renderTables();
  renderStats();
}

function renderLayoutBtns() {
  document.getElementById('btn-layout-a').className = 'layout-btn' + (state.layout === 'A' ? ' active' : '');
  document.getElementById('btn-layout-b').className = 'layout-btn' + (state.layout === 'B' ? ' active' : '');
}

function renderUnassigned() {
  const list = document.getElementById('unassigned-list');
  list.innerHTML = '';
  const guests = state.guests.slice().sort();
  document.getElementById('unassigned-count').textContent = guests.length;
  if (guests.length === 0) {
    list.innerHTML = '<div style="font-size:12px;color:var(--color-text-tertiary);text-align:center;padding:16px 8px;">All guests seated!</div>';
    return;
  }
  guests.forEach(name => {
    const chip = document.createElement('div');
    chip.className = 'guest-chip';
    chip.draggable = true;
    chip.dataset.guest = name;
    chip.innerHTML = `<div class="guest-initial">${initials(name)}</div><span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${name}</span><span class="remove-btn" title="Remove guest">×</span>`;
    chip.querySelector('.remove-btn').addEventListener('click', e => { e.stopPropagation(); removeGuest(name); });
    chip.addEventListener('dragstart', e => { dragGuest = name; chip.classList.add('dragging'); e.dataTransfer.effectAllowed = 'move'; });
    chip.addEventListener('dragend', () => { dragGuest = null; chip.classList.remove('dragging'); });
    list.appendChild(chip);
  });
}

function renderTables() {
  const grid = document.getElementById('tables-grid');
  grid.innerHTML = '';
  const tables = LAYOUTS[state.layout];
  tables.forEach(t => {
    const seated = state.seating[t.id] || [];
    const name = state.tableNames[t.id] || t.name;
    const full = seated.length >= t.cap;

    const card = document.createElement('div');
    card.className = 'table-card';
    card.dataset.tableId = t.id;

    card.addEventListener('dragover', e => { e.preventDefault(); if (!full || isSeated(dragGuest)) card.classList.add('drag-over'); });
    card.addEventListener('dragleave', () => card.classList.remove('drag-over'));
    card.addEventListener('drop', e => {
      e.preventDefault();
      card.classList.remove('drag-over');
      if (dragGuest) assignToTable(dragGuest, t.id);
    });

    const header = document.createElement('div');
    header.className = 'table-header';
    header.innerHTML = `
      <div class="table-name-row">
        <input class="table-name-input" value="${name}" title="Click to rename" />
      </div>
      <div class="table-meta ${full ? 'full' : ''}">${seated.length} / ${t.cap}${full ? ' — full' : ''}</div>
    `;
    const nameInput = header.querySelector('input');
    nameInput.addEventListener('change', () => {
      state.tableNames[t.id] = nameInput.value.trim() || t.name;
      save();
    });

    const seatList = document.createElement('div');
    seatList.className = 'seat-list';
    if (seated.length === 0) {
      seatList.innerHTML = '<div class="empty-drop">Drop guests here</div>';
    } else {
      seated.slice().sort().forEach(g => {
        const sc = document.createElement('div');
        sc.className = 'seat-chip';
        sc.draggable = true;
        sc.dataset.guest = g;
        sc.innerHTML = `<div class="seat-initial">${initials(g)}</div><span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px">${g}</span><span class="x" title="Move back to unassigned">×</span>`;
        sc.querySelector('.x').addEventListener('click', e => { e.stopPropagation(); unassignGuest(g); });
        sc.addEventListener('dragstart', e => { dragGuest = g; sc.classList.add('dragging'); e.dataTransfer.effectAllowed = 'move'; });
        sc.addEventListener('dragend', () => { dragGuest = null; sc.classList.remove('dragging'); });
        seatList.appendChild(sc);
      });
    }

    card.appendChild(header);
    card.appendChild(seatList);
    grid.appendChild(card);
  });
}

function renderStats() {
  const tables = LAYOUTS[state.layout];
  const totalCap = tables.reduce((s, t) => s + t.cap, 0);
  const seated = Object.values(state.seating).reduce((s, a) => s + a.length, 0);
  const total = state.guests.length + seated;
  document.getElementById('stat-total').textContent = total;
  document.getElementById('stat-seated').textContent = seated;
  document.getElementById('stat-unassigned').textContent = state.guests.length;
  document.getElementById('stat-capacity').textContent = totalCap;
  document.getElementById('stat-remaining').textContent = Math.max(0, totalCap - seated);
}

render();
</script>
</body>
</html>
